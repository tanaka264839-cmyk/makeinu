# 負け犬の癒し：受け口の決まりのうち、http の段に置くもの。サーバーの /etc/nginx/conf.d/makeinu.conf に置く
limit_conn_zone $binary_remote_addr zone=makeinu_conn:10m;  # 同時のつなぎを番地ごとに数える。番地は覚え場所（メモリ）の中だけで、記録には残さない

# 検索に出すのは、はじめの画面だけ。書き込みの並ぶ画面は、書いた人が身近な人の検索で見つからないように出さない（決定メモ「受け口」）
map $uri $makeinu_kensaku {
    default "noindex, nofollow";
    / "";
}
