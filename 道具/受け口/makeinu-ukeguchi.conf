# 負け犬の癒し：受け口から場へ渡す決まり。どの入口（server）からも include する。サーバーの /etc/nginx/snippets/ に置く
# 場は 127.0.0.1 だけで開いている。行き先は入口ごとに $makeinu_ba で決める（本物は 127.0.0.1:8765）
access_log off;              # 来た人の番地を、受け口の記録に残さない（番地は書いた人の記録にだけ半年。個人情報の扱い）
error_log /dev/null;         # 不具合の記録にも来た人の番地が入るので残さない。場の不具合は場の記録（journal）で見る
client_max_body_size 64k;    # 場が1回に読む大きさ（決まり.py 送られた中身の上限）を超える送信は、ここで断る
limit_conn makeinu_conn 20;  # 同じ番地から同時に受けるのは20まで（つなぎの数の上限は受け口で持つ）
server_tokens off;           # 受け口の版を見せない（Ubuntu の nginx.conf の http の段に server_tokens があるので、ここ server の段で上書きする）
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header X-Robots-Tag $makeinu_kensaku always;  # はじめの画面のほかは検索に出さない（行き先は makeinu-http.conf。値が空なら付かない）

# 場が止まっている・混み合っている時は、英語の画面でなく日本語で知らせる（文は /var/www/makeinu-yasumi/yasumi.html。正本は 受け口/yasumi.html）
error_page 502 503 504 /yasumi.html;
location = /yasumi.html {
    internal;
    root /var/www/makeinu-yasumi;
    charset utf-8;
}

location / {
    proxy_pass http://$makeinu_ba;
    # 来た人の番地と港。来た人が付けてきた同じ名前の見出しは、ここで上書きする（場は受け口から来た時だけ信じる）
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Real-Port $remote_port;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
}
