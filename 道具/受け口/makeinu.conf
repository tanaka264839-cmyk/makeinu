# 負け犬の癒し：外から来た人を受ける入口（受け口）。サーバーの /etc/nginx/sites-available/makeinu に置き、sites-enabled から指す
# IPv4 だけで聞く（書いた人の記録と荒らしの数えは IPv4 の番地で。AAAA も作らない）。決まりは決定メモ「受け口」

# 番地だけ・ほかの名前で来た頼みは、場へ渡さず切る。名前を知らずに端から見て回る機械に、中身を見せないため
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
    error_log /dev/null;
    server_tokens off;
    return 444;
}

# http：証明書の確かめのほかは https へ移すだけ。書き込みを暗号なしで通さないため
server {
    listen 80;
    server_name makeinu.net;
    access_log off;
    error_log /dev/null;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/makeinu-shoumei;
        default_type text/plain;
    }
    location / {
        return 301 https://makeinu.net$request_uri;
    }
}

# https：本物の入口
server {
    listen 443 ssl;
    server_name makeinu.net;
    ssl_certificate /etc/letsencrypt/live/makeinu.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/makeinu.net/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Google Search Console の持ち主の確かめ（はじめの画面を検索に出すため）。消すと確かめが外れる
    location = /googlec60040ad8ece56b7.html {
        default_type text/html;
        return 200 "google-site-verification: googlec60040ad8ece56b7.html";
    }
    set $makeinu_ba 127.0.0.1:8765;
    include snippets/makeinu-ukeguchi.conf;
}
